    pid: host
  postgres-exporter:
    image: "${SLAS_REGISTRY}/prometheuscommunity/postgres-exporter:v0.17.1"
    restart: unless-stopped
    user: 65534:65534
    networks:
      - slas-observability
      - slas-backend
    environment:
      DO_NOT_TRACK: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
      DATA_SOURCE_URI: "postgres:5432/${POSTGRES_DB}?sslmode=disable"
