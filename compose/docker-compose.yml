      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities:
                - gpu
  node-exporter:
    image: "${SLAS_REGISTRY}/prom/node-exporter:v1.9.0"
    restart: unless-stopped
    user: 65534:65534
    networks:
      - slas-observability
    environment:
      DO_NOT_TRACK: "1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      HF_HUB_DISABLE_TELEMETRY: "1"
    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
