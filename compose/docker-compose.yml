      - ALL
    healthcheck:
      test:
        - CMD
        - slas-health
        - http://127.0.0.1:9187/metrics
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    secrets:
      - postgres_password
    depends_on:
      postgres:
        condition: service_healthy
