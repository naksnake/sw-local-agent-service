# Image lock for SW Local Agent Service (ADR-0003, INV-8). Rendered from
# slas_deploy.images.DEFAULT_IMAGES; a unit test keeps file and code in step; the JSON twin
# is what install.sh reads. Tags are immutable upstream releases. `digest` and `image_id`
# are filled by scripts/lock-images.sh on a connected build host and signed with cosign;
# while any image the chosen profile starts is null, install.sh refuses to start it.
# `started_by: model-manager` marks the vLLM image: pulled, saved and locked like the
# others, never a compose service — the model manager starts it per role and voter.
version: 1
default_registry: registry.internal
