  - id: bge-reranker-v2-m3
    display_name: "BGE Reranker v2 M3"
    family: "BAAI"
    path: "bge-reranker-v2-m3"
    quant: bf16
    vram_gib: 2
    context: 8192
    roles: [rerank]
roles:
  coder: qwen2.5-coder-32b-awq
  planner: deepseek-v3-fp8
  triage: qwen2.5-7b-awq
  embed: bge-m3
  rerank: bge-reranker-v2-m3
