[project]
name = "slas-model-manager"
version = "0.0.1"
description = "Model manager: the registry, fit sentences, vLLM container specs, blue/green swaps, reconciliation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The approved set of ADR-0005/ADR-0015: the HTTP surface through slas-http, the runtime
# socket through slas-container. Tests run against FakeContainerApi and scripted transports.
dependencies = [
  "slas-schemas",
  "slas-llm-gateway",
  "slas-http",
  "pyyaml==6.0.3",
  "types-PyYAML==6.0.12.20260906",
  "slas-container",
  "slas-observability",
]

[project.scripts]
slas-model-manager = "slas_model_manager.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
slas-schemas = { workspace = true }
slas-llm-gateway = { workspace = true }
slas-http = { workspace = true }
slas-container = { workspace = true }
slas-observability = { workspace = true }
