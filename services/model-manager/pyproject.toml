[project]
name = "slas-model-manager"
version = "0.0.1"
description = "Model manager: the registry, fit sentences, vLLM container specs, blue/green swaps, reconciliation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The Podman driver behind ContainerRuntime and the HTTP surface arrive with their approved
# dependencies; everything here runs against FakeRuntime and FakeSmokeTester.
dependencies = ["slas-schemas", "slas-llm-gateway"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
slas-schemas = { workspace = true }
slas-llm-gateway = { workspace = true }
