[project]
name = "slas-llm-gateway"
version = "0.0.1"
description = "LLM gateway: role routing, redaction, guided_json enforcement, circuit breaker, Consensus Router"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The HTTP surface (FastAPI app, httpx to vLLM) comes through slas-http, the shared stack of
# ADR-0015 (the dependency set of ADR-0005). Tests run against the in-process fake vLLM.
dependencies = [
  "slas-observability",
  "slas-schemas",
  "slas-http",
  "pyyaml==6.0.3",
  "types-PyYAML==6.0.12.20260906",
]

[project.scripts]
slas-gateway = "slas_llm_gateway.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
slas-observability = { workspace = true }
slas-schemas = { workspace = true }
slas-http = { workspace = true }
