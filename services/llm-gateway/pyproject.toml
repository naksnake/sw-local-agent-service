[project]
name = "slas-llm-gateway"
version = "0.0.1"
description = "LLM gateway: role routing, redaction, guided_json enforcement, circuit breaker, Consensus Router"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# The HTTP surface (FastAPI, httpx to vLLM) is added once those dependencies are approved
# (ADR-0005). Everything here runs against the in-process fake vLLM.
dependencies = ["slas-schemas"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
slas-schemas = { workspace = true }
