[project]
name = "slas-git-broker"
version = "0.0.1"
description = "git-broker: credentials by reference, hardened git, validation gate, push + MR, bundles"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["slas-authz", "slas-git", "slas-schemas"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
slas-authz = { workspace = true }
slas-git = { workspace = true }
slas-schemas = { workspace = true }
