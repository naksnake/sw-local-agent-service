<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SW Local Agent Service — UI demo</title>
<style>
:root{
  --bench:#E9ECEF; --panel:#FFFFFF; --ink:#171B21; --ink-2:#5B6470; --ink-3:#8A929D;
  --rule:#D5DAE0; --rule-2:#EDF0F3;
  --accent:#2B4C7E; --accent-ink:#FFFFFF; --accent-soft:#E3EAF5; --accent-hover:#234070;
  --pass:#1E8E5A; --pass-soft:#E4F3EB;
  --warn:#B8760A; --warn-soft:#FBF1DD;
  --fail:#B3261E; --fail-soft:#FBE6E4;
  --console:#14181D; --console-ink:#C9D1D9; --console-dim:#6B7684;
  --sans:"IBM Plex Sans","Source Sans 3","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"IBM Plex Mono","SF Mono",Menlo,Consolas,monospace;
  --r-panel:6px; --r-ctl:4px; --r-led:2px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bench);color:var(--ink);font:13.5px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
button{font:inherit;color:inherit}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-0.01em}
h1{font-size:20px} h2{font-size:15px} h3{font-size:16px}
p{margin:0}
.muted{color:var(--ink-2)} .faint{color:var(--ink-3)}
.mono{font-family:var(--mono);font-size:12.5px}
.sentence{font-size:14.5px;line-height:1.55}
.nowrap{white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ── Layout ── */
.app{display:grid;grid-template-columns:200px 1fr;min-height:100vh}
.rail{background:var(--panel);border-right:1px solid var(--rule);padding:18px 12px;display:flex;flex-direction:column;gap:2px;position:sticky;top:0;height:100vh}
.brand{padding:4px 10px 16px;border-bottom:1px solid var(--rule-2);margin-bottom:10px}
.brand strong{display:block;font-size:14px;letter-spacing:-0.01em}
.brand span{display:block;font-size:12px;color:var(--ink-3);margin-top:2px}
.rail a{display:block;padding:8px 10px;border-radius:var(--r-ctl);color:var(--ink-2);text-decoration:none}
.rail a:hover{background:var(--rule-2);color:var(--ink)}
.rail a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.rail .spacer{flex:1}
.rail .foot{padding:10px;font-size:12px;color:var(--ink-3);border-top:1px solid var(--rule-2)}
.main{min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid var(--rule);background:var(--panel);position:sticky;top:0;z-index:5}
.topbar .health{display:flex;align-items:center;gap:8px;color:var(--ink-2);font-size:13px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--pass);display:inline-block;flex:none}
.dot.warn{background:var(--warn)} .dot.fail{background:var(--fail)} .dot.idle{background:var(--ink-3)}
#view{padding:24px 28px 48px;max-width:1220px}
.page-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px}
.page-head .lede{margin-top:4px;color:var(--ink-2);font-size:14px}
.cols{display:grid;gap:16px}
.cols-2{grid-template-columns:1fr 1fr} .cols-3{grid-template-columns:repeat(3,1fr)}
.cols-main{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}
.stack{display:flex;flex-direction:column;gap:16px}

/* ── Panels ── */
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-panel);padding:16px 18px}
.panel > h2{margin-bottom:10px}
.panel.tight{padding:0}
.panel.tight > h2{padding:14px 18px 10px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.row.wrap{flex-wrap:wrap}
.hr{height:1px;background:var(--rule-2);margin:12px 0}

/* ── Controls ── */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--panel);cursor:pointer;line-height:1.2;white-space:nowrap}
.btn:hover{background:var(--rule-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{color:var(--fail);border-color:#E4B9B6}
.btn.danger:hover{background:var(--fail-soft)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--rule-2)}
.btn.small{padding:4px 9px;font-size:12.5px}
.btn:disabled{opacity:.5;cursor:default}
.btn:disabled:hover{background:var(--panel)}
.btn.primary:disabled:hover{background:var(--accent)}
input,select,textarea{font:inherit;color:inherit;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-ctl);padding:7px 10px}
textarea{width:100%;min-height:220px;font-family:var(--mono);font-size:12.5px;line-height:1.5;resize:vertical}
label.field{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:4px}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:999px;font-size:12px;background:var(--rule-2);color:var(--ink-2);white-space:nowrap}
.pill.pass{background:var(--pass-soft);color:var(--pass)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.fail{background:var(--fail-soft);color:var(--fail)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border:1px solid var(--rule);border-radius:999px;font-size:12.5px;cursor:pointer;background:var(--panel);user-select:none}
.chip.on{background:var(--accent-soft);border-color:var(--accent-soft);color:var(--accent);font-weight:600}
.menu{position:relative;display:inline-block}
.menu-list{position:absolute;top:calc(100% + 4px);left:0;background:var(--panel);border:1px solid var(--rule);border-radius:var(--r-ctl);min-width:180px;box-shadow:0 6px 18px rgba(23,27,33,.08);z-index:20;display:none;padding:4px}
.menu.open .menu-list{display:block}
.menu-list button{display:block;width:100%;text-align:left;padding:7px 10px;border:0;background:none;border-radius:3px;cursor:pointer}
.menu-list button:hover{background:var(--rule-2)}
.menu-list .hint{padding:6px 10px 4px;font-size:11.5px;color:var(--ink-3)}

/* ── Lists & tables ── */
table.list{width:100%;border-collapse:collapse}
table.list th{text-align:left;font-weight:500;color:var(--ink-2);font-size:12.5px;padding:8px 18px;border-bottom:1px solid var(--rule)}
table.list td{padding:10px 18px;border-bottom:1px solid var(--rule-2);vertical-align:top}
table.list tr:last-child td{border-bottom:0}
table.list tr.click{cursor:pointer}
table.list tr.click:hover td{background:#FAFBFC}
ul.plain{list-style:none;margin:0;padding:0}
.check li{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--rule-2)}
.check li:last-child{border-bottom:0}
.check .box{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--rule);flex:none;margin-top:2px;display:grid;place-items:center;font-size:11px}
.check .box.done{background:var(--pass);border-color:var(--pass);color:#fff}
.check .box.now{border-color:var(--warn);background:var(--warn-soft)}
.feed li{display:grid;grid-template-columns:64px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule-2)}
.feed li:last-child{border-bottom:0}
.feed time{color:var(--ink-3);font-family:var(--mono);font-size:12px;padding-top:2px}
.jobs li{display:grid;grid-template-columns:1fr auto;gap:12px;padding:12px 18px;border-bottom:1px solid var(--rule-2);align-items:center}
.jobs li:last-child{border-bottom:0}
.jobs .title{font-weight:600}
.jobs .sub{color:var(--ink-2);margin-top:2px}
.bar{height:6px;background:var(--rule-2);border-radius:3px;overflow:hidden;width:180px}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .4s ease}

/* ── Three-part error ── */
.notice{border:1px solid #E4B9B6;background:var(--fail-soft);border-radius:var(--r-panel);padding:14px 16px}
.notice.warn{border-color:#EAD3A2;background:var(--warn-soft)}
.notice dl{display:grid;grid-template-columns:110px 1fr;gap:4px 12px;margin:8px 0 0}
.notice dt{color:var(--ink-2)} .notice dd{margin:0}

/* ── LED cycle map (the hero) ── */
.leds{display:flex;flex-wrap:wrap;gap:5px;margin:14px 0 10px}
.led{width:38px;height:26px;border-radius:var(--r-led);border:1px solid var(--rule);display:grid;place-items:center;font-size:11.5px;font-family:var(--mono);color:var(--ink-3);background:var(--panel)}
.led.pass{background:var(--pass);border-color:var(--pass);color:#fff}
.led.fail{background:var(--fail);border-color:var(--fail);color:#fff}
.led.now{background:var(--warn);border-color:var(--warn);color:#fff;animation:pulse 1.6s ease-in-out infinite}
.led.paused{background:var(--warn-soft);border-color:var(--warn);color:var(--warn)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.led.now{animation:none}}
.progress{height:8px;background:var(--rule-2);border-radius:4px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--accent);transition:width .6s ease}

/* ── Console ── */
.console{background:var(--console);color:var(--console-ink);border-radius:var(--r-panel);padding:12px 14px;font-family:var(--mono);font-size:12px;line-height:1.55;height:420px;overflow:auto;white-space:pre-wrap;word-break:break-word}
.console .t{color:var(--console-dim)}
.console .bad{color:#F2A49E}
.console .ok{color:#8FD3A9}
.console-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}

/* ── Consensus ── */
.votes{display:flex;flex-direction:column;gap:6px}
.vote{display:grid;grid-template-columns:150px 92px 1fr;gap:10px;align-items:baseline;padding:8px 10px;border:1px solid var(--rule-2);border-radius:var(--r-ctl)}
.vote .who{font-weight:600}
.vote .v{font-weight:600}
.vote .v.ok{color:var(--pass)} .vote .v.no{color:var(--warn)}

/* ── Tabs ── */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--rule);margin-bottom:12px}
.tab{padding:8px 12px;border:0;background:none;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.sop{white-space:pre-wrap;line-height:1.65;font-size:13.5px}
.sop.zh{font-size:14px;line-height:1.8}

/* ── Model cards ── */
.mcard{border:1px solid var(--rule);border-radius:var(--r-panel);padding:14px 16px;display:grid;grid-template-columns:1fr auto;gap:8px 16px}
.mcard .name{font-weight:600;font-size:14.5px}
.mcard .meta{color:var(--ink-2);margin-top:2px}
.mcard .fit{margin-top:8px}
.roles{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.role{border:1px solid var(--rule);border-radius:var(--r-panel);padding:10px 12px}
.role .k{color:var(--ink-2);font-size:12.5px}
.role .v{font-weight:600;margin-top:2px}
.role .v.none{color:var(--ink-3);font-weight:400}
.steps li{display:grid;grid-template-columns:20px 1fr auto;gap:10px;padding:6px 0;align-items:center}
.steps .s{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--rule)}
.steps .s.done{background:var(--pass);border-color:var(--pass)}
.steps .s.now{border-color:var(--warn);background:var(--warn-soft)}

/* ── Dialogs & toasts ── */
.scrim{position:fixed;inset:0;background:rgba(23,27,33,.35);display:grid;place-items:center;z-index:50;padding:20px}
.dialog{background:var(--panel);border-radius:8px;width:min(620px,100%);max-height:90vh;overflow:auto;padding:22px 24px;border:1px solid var(--rule)}
.dialog.wide{width:min(820px,100%)}
.dialog h3{margin-bottom:8px}
.dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:6px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(0,0,0,.18)}

@media (max-width:900px){
  .app{grid-template-columns:1fr}
  .rail{position:static;height:auto;flex-direction:row;flex-wrap:wrap;gap:4px;padding:10px}
  .brand{border:0;margin:0;padding:6px 10px;width:100%}
  .rail .spacer,.rail .foot{display:none}
  .cols-2,.cols-3,.cols-main{grid-template-columns:1fr}
  .roles{grid-template-columns:1fr 1fr}
  #view{padding:16px}
  .topbar{padding:12px 16px}
}
</style>
</head>
<body>
<div class="app">
  <nav class="rail" id="rail"></nav>
  <div class="main">
    <header class="topbar">
      <div class="health" id="health"></div>
      <div class="row">
        <span class="pill" id="clock"></span>
        <button class="btn small ghost" onclick="toast('Signed in as a validation engineer. Roles and permissions are managed under Admin.')">Signed in</button>
      </div>
    </header>
    <main id="view"></main>
  </div>
</div>
<div id="dialog-root"></div>
<div id="toast-root"></div>

<script>
/* ────────────────────────────────────────────────────────────────────────
   SW Local Agent Service — clickable UI demo.
   Everything here is simulated in the browser. Change PRODUCT_NAME to rename.
   ──────────────────────────────────────────────────────────────────────── */
const PRODUCT_NAME = "SW Local Agent Service";

const PAGES = [
  ["home","Home"],["coding","Coding"],["validation","Validation"],["factory","Factory"],
  ["runs","Runs"],["models","Models"],["skills","Skills"],["settings","Settings"],["admin","Admin"]
];

/* ── State ─────────────────────────────────────────────────────────────── */
const S = {
  page: "home",
  clock: 14*3600 + 2*60 + 11,               // 14:02:11, advances with the simulation
  run: {
    id: 418, total: 25, cycle: 12, step: 2,  // step: 0 quiesce, 1 off/on, 2 boot, 3 verify
    status: "running",                       // running | pausing | paused | aborted | done
    passed: [], failed: [], findings: [], lines: [],
    startedMin: 64,
  },
  coding: {
    ticket:"C-1187", title:"Add event-log export to the BMC tool", iteration:4, status:"running", fresh:false, toolchain:["Python 3.12","Shell (bash 5.2)"],
    plan:[
      {t:"Add a “sel export” command with target and output-file arguments", s:"done"},
      {t:"Fetch the event log over Redfish and map entries to JSON", s:"done"},
      {t:"Add a request timeout so a slow BMC can't hang the tool", s:"done"},
      {t:"Handle truncated responses without crashing", s:"now", note:"fixing one failing test"},
      {t:"Update the README with a usage example", s:""},
    ],
    feed:[
      ["14:01:02","Read the plan and the 3 files it names. Found the Redfish client has no timeout."],
      ["14:01:40","Wrote the new command and 3 tests. Ran the suite in the sandbox: 44 passed, 1 failed."],
      ["14:02:05","Looked up “Redfish LogService truncated response” in the knowledge base. Found the vendor note on 4 KB chunking."],
      ["14:02:11","Failing test: <span class=\"mono\">test_sel_parse_truncated</span>. Cause: the parser assumes the JSON closes. Adding a partial-read path."],
      ["now","<span class=\"muted\">Re-running lint, type check and tests…</span>"],
    ],
  },
  factory: {
    ticket:"F-2291", station:7, sn:"7K2-00418", test:6, total:9, template:"Final test", fresh:false,
    steps:["Power on and reach the login screen","Log in through the station GUI","Read serial numbers and match the label","Check every fan and temperature sensor","Run burn-in for 10 minutes","Check burn-in result in the BurnIn window","Read event log — must be empty","Power off and confirm standby current","Back up the station's system state"],
    feed:[
      ["13:48:10","Focused the window “Login”. Typed the station account and pressed Enter."],
      ["13:48:22","Waited for “BurnIn v3.2” to appear (took 9 s). Clicked “Start test”."],
      ["13:48:40","Read the serial number field: 7K2-00418. Matches the label scanned at intake."],
      ["13:49:02","Ran <span class=\"mono\">sensors --json</span> over SSH. 12 fans and 18 sensors reporting, all in range."],
      ["now","<span class=\"muted\">Watching the BurnIn progress bar. Screenshot every 60 s is saved to the ticket.</span>"],
    ],
  },
  queue: [],          // validation runs approved and waiting for a free server
  wiz: null,          // the open "New …" wizard, if any
  codingTab: "agent", // agent | git | terminal
  gitTab: "status",   // status | commit | history | push | bundle
  git: {
    branch:"agent/C-1187-sel-export", base:"main", ahead:4, pushed:false, pushedTo:null, mr:null, remote:"gitlab-firmware",
    changes:[ {f:"bmc_tool/commands/sel.py", s:"M", by:"you, in the terminal"}, {f:"README.md", s:"M", by:"the agent"} ],
    history:[
      {sha:"a41f9c2", msg:"Handle truncated SEL responses with a partial-read path", who:"Coding agent", agent:true, ticket:"C-1187", when:"14:02"},
      {sha:"7be03d1", msg:"Add a 30 s timeout to every Redfish GET",               who:"Coding agent", agent:true, ticket:"C-1187", when:"14:01"},
      {sha:"c0de55a", msg:"Map SEL entries to JSON",                                who:"Coding agent", agent:true, ticket:"C-1187", when:"14:01"},
      {sha:"e19b7f0", msg:"Add sel export command with target and output arguments", who:"Coding agent", agent:true, ticket:"C-1187", when:"14:01"},
      {sha:"3d2a9b8", msg:"Bump version to 0.6.0",                                   who:"You", agent:false, when:"Yesterday"},
    ],
  },
  remotes: [
    { id:"gitlab-firmware", name:"gitlab-firmware", uri:"https://gitlab.internal/firmware/bmc-tool.git", host:"gitlab.internal", auth:"pat", fp:"token ending 7f2a", ops:"clone, pull, push to branches", lastUsed:"Yesterday, 16:02" },
    { id:"gitea-docs",      name:"gitea-docs",      uri:"git@gitea.internal:validation/sops.git",        host:"gitea.internal",  auth:"ssh", fp:"SHA256:4KqZ…nR8w",  ops:"push to branches",            lastUsed:"Today, 09:41" },
  ],
  gitHosts: [
    { host:"gitlab.internal", allowed:true,  auth:"Token or SSH key", note:"Internal GitLab. Merge requests are opened automatically." },
    { host:"gitea.internal",  allowed:true,  auth:"SSH key",          note:"Docs and SOP repositories." },
    { host:"github.com",      allowed:false, auth:"",                 note:"Blocked. This installation has no route to it; allowing it needs an ADR." },
  ],
  term: { lines: [] },
  gpus: { count: 4, eachGB: 80 },
  models: [
    { id:"qwen-coder-32b-fp8",   name:"Qwen Coder 32B",     quant:"FP8", vram:40, ctx:"65k context",  task:"generate", votes:true,  note:"Strong tool calling. Good default for code." },
    { id:"deepseek-coder-v2-fp8",name:"DeepSeek Coder V2",  quant:"FP8", vram:34, ctx:"128k context", task:"generate", votes:true,  note:"Longer context. Slightly slower first token." },
    { id:"kimi-dev-72b-awq",     name:"Kimi Dev 72B",       quant:"AWQ", vram:42, ctx:"128k context", task:"generate", votes:true,  note:"Best on large test suites and long plans." },
    { id:"qwen-7b-awq",          name:"Qwen 7B Instruct",   quant:"AWQ", vram:8,  ctx:"32k context",  task:"generate", votes:false, note:"Fast. Used for high-volume log triage." },
    { id:"bge-m3",               name:"BGE-M3",             quant:"—",   vram:3,  ctx:"8k input",     task:"embed",    votes:false, note:"Embeddings for search. Multilingual." },
  ],
  roles: { coder:"qwen-coder-32b-fp8", planner:"qwen-coder-32b-fp8", triage:"qwen-7b-awq", embed:"bge-m3", rerank:null },
  lastSwap: null,
  skills: [
    { id:"sel-collect",   name:"Collect and clear BMC event log",        kind:"Commands",          steps:4, agents:{coding:false,validation:true, factory:true },  by:"Validation team" },
    { id:"station-login", name:"Log in to test station and start BurnIn",kind:"Screen actions",    steps:9, agents:{coding:false,validation:false,factory:true },  by:"Factory team" },
    { id:"lint-test",     name:"Lint, type-check and run tests",          kind:"Commands",          steps:3, agents:{coding:true, validation:false,factory:false}, by:"Firmware team" },
    { id:"shot-cycle",    name:"Screenshot the console after each power cycle", kind:"Screen actions + commands", steps:2, agents:{coding:false,validation:true, factory:false}, by:"Validation team" },
  ],
};

/* ── Utilities ─────────────────────────────────────────────────────────── */
const $ = (sel, root=document) => root.querySelector(sel);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hhmmss(t){ const h=Math.floor(t/3600)%24, m=Math.floor(t/60)%60, s=t%60; return [h,m,s].map(n=>String(n).padStart(2,"0")).join(":"); }
function dur(min){ if(min<1) return "under a minute"; if(min<60) return `${Math.round(min)} min`; const h=Math.floor(min/60), m=Math.round(min%60); return m? `${h} h ${m} min` : `${h} h`; }
function toast(msg){ const r=$("#toast-root"); r.innerHTML=`<div class="toast">${esc(msg)}</div>`; clearTimeout(toast._t); toast._t=setTimeout(()=>r.innerHTML="",3200); }
function dialog(html, {wide=false}={}){ $("#dialog-root").innerHTML=`<div class="scrim" onclick="if(event.target===this)closeDialog()"><div class="dialog${wide?" wide":""}" role="dialog" aria-modal="true">${html}</div></div>`; const f=$("#dialog-root .dialog button, #dialog-root .dialog [tabindex]"); if(f) f.focus(); }
function closeDialog(){ $("#dialog-root").innerHTML=""; }
document.addEventListener("keydown", e=>{ if(e.key==="Escape") closeDialog(); });
document.addEventListener("click", e=>{ if(!e.target.closest(".menu")) document.querySelectorAll(".menu.open").forEach(m=>m.classList.remove("open")); });
function toggleMenu(btn){ const m=btn.closest(".menu"); const open=m.classList.contains("open"); document.querySelectorAll(".menu.open").forEach(x=>x.classList.remove("open")); if(!open) m.classList.add("open"); }
const modelById = id => S.models.find(m=>m.id===id);
const modelName = id => id ? modelById(id).name : "None";

/* ── Git: broker-side (Method 1) ───────────────────────────────────────── */
const remoteById = id => S.remotes.find(r=>r.id===id);
function shortSha(){ return Math.floor(Math.random()*0xfffffff).toString(16).padStart(7,"0"); }
function hostOf(uri){ let m=uri.match(/^https?:\/\/([^\/:]+)/i); if(m) return m[1].toLowerCase(); m=uri.match(/^[\w.-]+@([^:]+):/); if(m) return m[1].toLowerCase(); m=uri.match(/^ssh:\/\/(?:[^@]+@)?([^\/:]+)/i); if(m) return m[1].toLowerCase(); return null; }

function openGitPush(){
  const g=S.git; if(!S.remotes.length){ toast("Add a remote under Settings first."); return; }
  const r=remoteById(g.remote)||S.remotes[0];
  dialog(`<h3>Push and open a merge request</h3>
  <label class="field">Remote</label><select id="push-remote" style="width:100%;margin-bottom:10px" onchange="S.git.remote=this.value">${S.remotes.map(x=>`<option value="${x.id}" ${x.id===r.id?"selected":""}>${esc(x.name)} — ${esc(x.host)}</option>`).join("")}</select>
  <p class="sentence">This sends the <strong>${g.ahead} commits</strong> on <span class="mono">${esc(g.branch)}</span> to <strong>${esc(r.name)}</strong> as a new branch and opens a merge request against <span class="mono">${g.base}</span>. Nothing is merged automatically. The credential is used inside the broker only; the sandbox never sees it.</p>
  <div class="hr"></div>
  <p class="muted">Checks before pushing</p>
  <ul class="plain check" style="margin-top:6px">
    <li><span class="box done">✓</span><span>Changes stay inside the project folder</span></li>
    <li><span class="box done">✓</span><span>No secrets found in the diff</span></li>
    <li><span class="box done">✓</span><span>No Git hooks, submodules or escaping symlinks added</span></li>
    <li><span class="box now"></span><span>1 cross-check concern still open <span class="muted">— it will be noted in the merge request</span></span></li>
  </ul>
  ${g.changes.length?`<div class="notice warn" style="margin-top:10px"><strong>${g.changes.length} files have changes that aren't committed.</strong> They won't be pushed. Commit them in the Git tab first, or push the ${g.ahead} commits as they are.</div>`:""}
  <div class="actions"><button class="btn" onclick="closeDialog()">Not yet</button><button class="btn primary" onclick="runPush($('#push-remote').value)">Push and open merge request</button></div>`);
}
function runPush(remoteId){
  const r=remoteById(remoteId); const g=S.git;
  const steps=["Checking the changes: project scope, secrets, hooks","Cross-check of the agent's changes by 3 models",`Pushing ${g.ahead} commits to ${r.name}`,`Opening a merge request on ${r.host}`];
  let i=0; const paint=()=>dialog(`<h3>Pushing to ${esc(r.name)}</h3><ul class="plain steps">${steps.map((s,k)=>`<li><span class="s ${k<i?"done":k===i?"now":""}"></span><span class="${k>i?"muted":""}">${esc(s)}</span><span class="faint">${k<i?"done":k===i?"running":""}</span></li>`).join("")}</ul><div class="progress" style="margin-top:12px"><i style="width:${Math.round(i/steps.length*100)}%"></i></div><p class="faint" style="margin-top:10px">The credential is decrypted inside the broker for this operation only and discarded afterwards. Repository hooks are not run.</p>`);
  paint();
  const iv=setInterval(()=>{ i++; if(i>=steps.length){ clearInterval(iv); g.pushed=true; g.pushedTo=r.name; g.mr=91; g.remote=r.id; r.lastUsed="Just now"; closeDialog(); render(); toast(`Merge request 91 opened on ${r.host}. Nothing was merged. The reviewer has been notified.`); } else paint(); }, 900);
}
function commitLocal(msg, sha, who="You"){ const g=S.git; g.history.unshift({sha, msg, who, agent:false, when:"Just now"}); g.changes=[]; g.ahead++; g.pushed=false; }
function doCommit(){ const el=$("#commit-msg"); const msg=(el&&el.value.trim())||"Update"; const sha=shortSha(); commitLocal(msg, sha); S.gitTab="history"; render(); toast(`Committed as ${sha}. ${S.git.ahead} commits now ahead of main, not yet pushed.`); }
function discardChange(f){ S.git.changes=S.git.changes.filter(c=>c.f!==f); render(); toast(`Discarded changes to ${f}.`); }

function renderGitPanel(){
  const g=S.git; const sub=S.gitTab; const r=remoteById(g.remote)||S.remotes[0];
  const subtabs=`<div class="tabs" role="tablist">${[["status","Status"],["commit","Commit"],["history","History"],["push","Push and pull"],["bundle","Bundle"]].map(([k,l])=>`<button class="tab ${sub===k?"active":""}" role="tab" onclick="S.gitTab='${k}';render()">${l}</button>`).join("")}</div>`;
  let body="";
  if(sub==="status"){
    body=`<p class="sentence">On branch <span class="mono">${esc(g.branch)}</span>, ${g.ahead} commits ahead of <span class="mono">${g.base}</span>${g.pushed?`, all on ${esc(g.pushedTo)} with merge request ${g.mr} open`:", not yet pushed anywhere"}. ${g.changes.length?`${g.changes.length} files have changes not yet committed.`:"Nothing left to commit."}</p>
    ${g.changes.length?`<table class="list" style="margin-top:12px;border:1px solid var(--rule);border-radius:var(--r-panel);overflow:hidden"><thead><tr><th>File</th><th>Change</th><th></th></tr></thead><tbody>${g.changes.map(ch=>`<tr><td class="mono">${esc(ch.f)}</td><td>${ch.s==="M"?"Modified":ch.s==="A"?"Added":"Deleted"}${ch.by?` <span class="muted">by ${esc(ch.by)}</span>`:""}</td><td class="nowrap"><button class="btn small ghost" onclick="S.codingTab='terminal';termRun('git diff')">Diff</button> <button class="btn small ghost" onclick="discardChange('${esc(ch.f)}')">Discard</button></td></tr>`).join("")}</tbody></table>`:""}

  }
  if(sub==="commit"){
    body = g.changes.length ? `<p class="muted" style="margin-bottom:8px">Committing ${g.changes.length} files: ${g.changes.map(c=>`<span class="mono">${esc(c.f)}</span>`).join(", ")}.</p>
      <label class="field">Commit message</label><textarea id="commit-msg" style="min-height:80px;font-family:var(--sans)">Update README usage example and tidy sel.py imports</textarea>

      <div class="row"><button class="btn primary" onclick="doCommit()">Commit ${g.changes.length} files</button><button class="btn ghost" onclick="S.gitTab='status';render()">Back to status</button></div>`
      : `<p class="muted">Nothing to commit. Edit files in the terminal, or let the agent continue, then come back here.</p>`;
  }
  if(sub==="history"){
    body=`<ul class="plain feed">${g.history.map(h=>`<li><time>${esc(h.when)}</time><span><span class="mono">${h.sha}</span> ${esc(h.msg)} <span class="muted">— ${esc(h.who)}</span>${h.agent?` <span class="pill info">Agent, ${esc(h.ticket)}</span>`:""}</span></li>`).join("")}</ul>
    <p class="faint" style="margin-top:10px">Agent commits carry Slas-Agent and Slas-Ticket trailers, so anyone reading the history can tell what the agent did and which ticket asked for it.</p>`;
  }
  if(sub==="push"){
    body=`<div class="cols cols-2">
      <div class="panel"><h2>Push</h2>
        <label class="field">Remote</label><select style="width:100%;margin-bottom:10px" onchange="S.git.remote=this.value">${S.remotes.map(x=>`<option value="${x.id}" ${x.id===(r&&r.id)?"selected":""}>${esc(x.name)} — ${esc(x.host)}</option>`).join("")}</select>
        <p class="sentence">${g.pushed?`Everything on <span class="mono">${esc(g.branch)}</span> is already on ${esc(g.pushedTo)}. Merge request ${g.mr} is open.`:`${g.ahead} commits on <span class="mono">${esc(g.branch)}</span> are not on any remote yet.`}</p>
        <div class="row" style="margin-top:10px"><button class="btn primary" onclick="openGitPush()" ${g.pushed?"disabled":""}>Push and open merge request</button></div>
        <p class="faint" style="margin-top:10px">Pushes go to a new branch. Pushing straight to a protected branch is off for your role.</p>
      </div>
      <div class="panel"><h2>Pull</h2>
        <p class="sentence">Bring <span class="mono">${g.base}</span> from ${esc(r?r.name:"a remote")} into this repository.</p>
        <div class="row" style="margin-top:10px"><button class="btn" onclick="toast('Already up to date with ${r?esc(r.name):"remote"}/main.')">Pull ${g.base}</button><button class="btn ghost" onclick="toast('Fetched. 2 new branches on ${r?esc(r.name):"remote"}: review/qa-notes, hotfix/redfish-retry.')">Fetch only</button></div>
        <p class="faint" style="margin-top:10px">Pull runs in the broker, then the sandbox sees the updated files. Repository hooks are never executed there.</p>
      </div></div>
      <p class="muted" style="margin-top:12px">Remotes and credentials are managed under <a href="#settings" onclick="setPage('settings');return false">Settings → Git remotes</a>.</p>`;
  }
  if(sub==="bundle"){
    body=`<p class="sentence">A bundle is a single file that carries this repository's history. Use it to move work between sites that have no network path, on a USB drive.</p>
    <div class="cols cols-2" style="margin-top:12px">
      <div class="panel"><h2>Export</h2><p class="muted">Creates <span class="mono">${esc(S.coding.ticket)}.bundle</span> with all branches, about 1.4 MB.</p><div class="row" style="margin-top:10px"><button class="btn primary" onclick="toast('Downloading ${esc(S.coding.ticket)}.bundle (1.4 MB). Verified with git bundle verify.')">Export bundle</button></div></div>

/* ── Terminal inside the sandbox (Method 2) ────────────────────────────── */
function termPrompt(){ return `engineer@sandbox-${S.coding.ticket.toLowerCase()}:~/src$`; }
function termBanner(){ return `<span class="t">Connected to the sandbox for ${esc(S.coding.ticket)} (gVisor, no network). You are the workspace user. This session is recorded to the ticket; secrets you type are redacted.</span>`; }
function termLine(h){ S.term.lines.push(h); if(S.term.lines.length>300) S.term.lines.shift(); }
function termRun(raw){
  const cmd=String(raw||"").trim(); if(!cmd) return;
  termLine(`<span class="t">${esc(termPrompt())}</span> ${esc(cmd)}`);
  const out=termExec(cmd); if(out) termLine(out);
  render();
}
function termExec(cmd){
  const g=S.git; const parts=cmd.split(/\s+/); const c=parts[0]; const a=parts.slice(1); const args=a.join(" ");
  if(c==="clear"){ S.term.lines=[]; return ""; }
  if(c==="help") return esc("Commands that work in this demo:\n  git status | git log [--oneline] | git diff | git branch | git remote -v\n  git commit -m \"message\" | git push | git pull\n  ls | pwd | whoami | cat .git/config | env | python --version | curl <url> | clear");
  if(c==="pwd") return "/workspace/src";
  if(c==="whoami") return "engineer";
  if(c==="ls") return esc("README.md  bmc_tool/  pyproject.toml  tests/  uv.lock");
  if(c==="python"||c==="python3") return "Python 3.12.4";
  if(["curl","wget","pip","apt","apt-get","ssh","nc"].includes(c)) return `<span class="bad">${esc(c)}: could not resolve host.</span> This sandbox has no network. Packages come from the internal mirror the platform configures.`;
  if(c==="sudo"||c==="su") return `<span class="bad">bash: ${esc(c)}: command not found</span>`;
  if(c==="env") return esc("HOME=/home/engineer\nPATH=/usr/local/bin:/usr/bin:/bin\nGIT_CONFIG_GLOBAL=/etc/slas/gitconfig\nSLAS_TICKET="+S.coding.ticket+"\nSLAS_SANDBOX=gvisor")+`\n<span class="t"># no tokens, no keys, no remote credentials here — by construction</span>`;
  if(c==="cat"&&args===".git/config") return esc(`[core]\n\trepositoryformatversion = 0\n\tfilemode = true\n[remote "origin"]\n\turl = https://gitlab.internal/firmware/bmc-tool.git\n\tfetch = +refs/heads/*:refs/remotes/origin/*\n[branch "${g.branch}"]\n\tremote = origin\n\tmerge = refs/heads/${g.branch}`)+`\n<span class="t"># the URL is not a secret; the credential is not in this container</span>`;
  if(c==="cat") return `<span class="bad">cat: ${esc(args)}: No such file in this demo</span>`;
  if(c==="git"){
    const sub=a[0];
    if(sub==="status") return esc(`On branch ${g.branch}\nYour branch is ahead of '${g.base}' by ${g.ahead} commit${g.ahead===1?"":"s"}.`)+(g.changes.length?esc(`\n\nChanges not staged for commit:\n`)+g.changes.map(ch=>esc(`\tmodified:   ${ch.f}`)).join("\n"):esc("\n\nnothing to commit, working tree clean"));
    if(sub==="log"){ const one=a.includes("--oneline"); return g.history.map(h=> one ? `<span class="ok">${h.sha}</span> ${esc(h.msg)}` : esc(`commit ${h.sha}\nAuthor: ${h.who==="You"?"engineer <engineer@slas.local>":"Coding agent <coding-agent@slas.local>"}\nDate:   ${h.when}\n\n    ${h.msg}`)+(h.agent?esc(`\n\n    Slas-Agent: coding\n    Slas-Ticket: ${h.ticket}`):"")+"\n").join("\n"); }
    if(sub==="remote") return esc("origin\thttps://gitlab.internal/firmware/bmc-tool.git (fetch)\norigin\thttps://gitlab.internal/firmware/bmc-tool.git (push)");
    if(["push","pull","fetch","clone"].includes(sub)) return `<span class="bad">fatal: unable to access 'https://gitlab.internal/firmware/bmc-tool.git/': Could not resolve host: gitlab.internal</span>\n\nThis sandbox has no network and holds no credentials. Push from the <b>Git</b> tab: it uses your saved remote through the broker.`;
    if(sub==="diff") return g.changes.length ? esc(`diff --git a/${g.changes[0].f} b/${g.changes[0].f}\n--- a/${g.changes[0].f}\n+++ b/${g.changes[0].f}\n@@ -1,4 +1,5 @@`)+`\n<span class="bad">-import sys, json</span>\n<span class="ok">+import json</span>\n<span class="ok">+import sys</span>\n<span class="ok">+from bmc_tool.redfish import DEFAULT_TIMEOUT</span>` : "";
    if(sub==="add") return "";
    if(sub==="branch") return `* <span class="ok">${esc(g.branch)}</span>\n  ${esc(g.base)}`;
    if(sub==="commit"){ const m=cmd.match(/-m\s+(?:"([^"]+)"|'([^']+)')/); if(!m) return `<span class="bad">error: switch 'm' requires a value</span>`; if(!g.changes.length) return esc("nothing to commit, working tree clean"); const n=g.changes.length; const sha=shortSha(); commitLocal(m[1]||m[2], sha); return esc(`[${g.branch} ${sha}] ${m[1]||m[2]}\n ${n} file${n===1?"":"s"} changed, 9 insertions(+), 3 deletions(-)`); }
    return `<span class="bad">git: '${esc(sub||"")}' is not a git command in this demo.</span> Try: git status, git log --oneline, git diff, git remote -v, git push, git commit -m "message".`;
  }
  return `<span class="bad">bash: ${esc(c)}: command not found</span>`;
}
function renderTerminal(){
  if(!S.term.lines.length){ termLine(termBanner()); termLine(`<span class="t">${esc(termPrompt())}</span> git status`); termLine(termExec("git status")); }

function saveRemote(){

/* Console simulation */
function tick(){
  const r=S.run;
  S.clock += 12 + Math.floor(Math.random()*30);
  if(!(r.status==="running"||r.status==="pausing")) { renderHealth(); return; }
  const n=r.cycle, t=()=>`<span class="t">${hhmmss(S.clock)}</span>`;
  const willFail = n===14;
  const push = (s)=>{ r.lines.push(`${t()} ${s}`); if(r.lines.length>120) r.lines.shift(); };
  if(r.step===0){ push(`executor: sync complete. Event log saved (${300+n} entries). Fence marker <span class="ok">cycle-${n}</span> written.`); }
  else if(r.step===1){ push(`redfish: ForceOff → power state Off after 2.1 s. Waiting 10 s settle.`); push(`redfish: On → power state On.`); }
  else if(r.step===2){ push(`POST: memory training complete, 2048 GB.`); push(`POST: PCIe enumeration — 0000:8a:00.0 GPU3 ${willFail?'<span class="bad">x8 Gen4</span>':'x16 Gen5'}`); push(`Starting kernel …`); push(`ssh: reachable after ${60+Math.floor(Math.random()*30)} s.`); }
  else if(r.step===3){
    push(`verify: 2 CPUs, 32 DIMMs, 8 NVMe, 8 GPUs — <span class="ok">matches baseline</span>`);
    if(willFail){ push(`verify: <span class="bad">PCIe: GPU3 0000:8a:00.0 x16 Gen5 → x8 Gen4 — differs from baseline</span>`); push(`verify: <span class="bad">AER: 1 correctable error on 0000:8a:00.0</span>`); push(`gate: policy says continue and record. Finding routed to EE.`); r.failed.push(n); r.findings.push({cycle:n,title:"GPU3 link dropped from x16 Gen5 to x8 Gen4",detail:"Not recovered by warm boot.",owner:"EE"}); }
    else { push(`verify: PCIe links match baseline. Firmware unchanged. 0 new events, 0 AER, 0 GPU errors — <span class="ok">cycle ${n} passed</span>`); r.passed.push(n); }
  }
  r.startedMin += 1.4;
  if(r.step===3){
    if(n>=r.total){ r.status="done"; }
    else { r.cycle=n+1; r.step=0; if(r.status==="pausing"){ r.status="paused"; toast(`Run held after cycle ${n}.`); } }
  } else r.step++;
  if(S.page==="validation"||S.page==="home") render(); else renderHealth();
}
/* Seed history: cycles 1–11 passed, and a few console lines */
(function seed(){ const r=S.run; for(let i=1;i<=11;i++) r.passed.push(i); let c=S.clock-150; const L=(s,d)=>{ c+=d; r.lines.push(`<span class="t">${hhmmss(c)}</span> ${s}`); };
  L(`verify: PCIe links match baseline. Firmware unchanged. 0 new events — <span class="ok">cycle 11 passed</span>`,0);
  L(`executor: sync complete. Event log saved (311 entries). Fence marker <span class="ok">cycle-12</span> written.`,9);
  L(`redfish: ForceOff → power state Off after 2.0 s. Waiting 10 s settle.`,14);
  L(`redfish: On → power state On.`,12);
  L(`POST: memory training complete, 2048 GB.`,48);
  L(`POST: PCIe enumeration — 0000:8a:00.0 GPU3 x16 Gen5`,3);
})();

function fitSentence(m, role){
  const cur=S.roles[role]; const free=totalGB()-usedGB();
  if(cur===m.id) return `Already serving as ${role}.`;
  const curM=cur?modelById(cur):null; const curShared = curM && Object.values(S.roles).filter(x=>x===cur).length>1;
  const both = free>=m.vram;
  if(both) return `${m.name} needs about ${m.vram} GB. ${free} GB is free across GPUs 0–3, so both models fit and there's no downtime.`;
  const afterUnload = curM && !curShared ? free+curM.vram : free;
  if(afterUnload>=m.vram) return `${m.name} needs about ${m.vram} GB but only ${free} GB is free. The current ${role} must unload first — about 3 minutes with no ${role}.`;
  return `${m.name} needs about ${m.vram} GB. It won't fit even after unloading the current ${role}. Free a GPU or pick a smaller quantization.`;
}

  const free=totalGB()-usedGB();

    const roles=Object.entries(S.roles).filter(([,v])=>v===m.id).map(([k])=>k);
    const status = roles.length ? `<span class="pill pass">Serving as ${roles.join(" and ")}</span>` : `<span class="pill">Available</span>`;

        ${canGen ? `<div class="fit row" style="gap:8px"><span class="chip ${m.votes?"on":""}" onclick="toggleVote('${m.id}')">${m.votes?"Votes in cross-checks":"Not a voter"}</span></div>`:""}

                : `<div class="menu"><button class="btn" onclick="toggleMenu(this)">Use as</button><div class="menu-list"><button onclick="startSwap('${m.id}','embed')">Embed${S.roles.embed===m.id?" (current)":""}</button></div></div>`}

function startSwap(id, role){
  document.querySelectorAll(".menu.open").forEach(m=>m.classList.remove("open"));

  <div class="actions"><button class="btn" onclick="closeDialog()">Cancel</button><button class="btn primary" ${blocked?"disabled":""} onclick="runSwap('${id}','${role}')">Swap now</button></div>`);

function runSwap(id, role){
  const m=modelById(id); const steps=["Starting the new model","Loading weights onto the GPUs","Health check","Smoke test: 3 prompts, 1 tool call","Switching traffic to the new model"];
  let i=0;
  const paint=()=>{ dialog(`<h3>Swapping ${role} to ${esc(m.name)}</h3><ul class="plain steps">${steps.map((s,k)=>`<li><span class="s ${k<i?"done":k===i?"now":""}"></span><span class="${k>i?"muted":""}">${s}</span><span class="faint">${k<i?"done":k===i?"running":""}</span></li>`).join("")}</ul><div class="progress" style="margin-top:12px"><i style="width:${Math.round(i/steps.length*100)}%"></i></div><p class="faint" style="margin-top:10px">The current ${role} keeps serving until the last step.</p>`); };
  paint();
  const iv=setInterval(()=>{ i++; if(i>=steps.length){ clearInterval(iv); S.lastSwap={role,prev:S.roles[role]}; S.roles[role]=id; closeDialog(); render(); toast(`${role[0].toUpperCase()+role.slice(1)} is now ${m.name}. Rollback available for 24 hours.`); } else paint(); }, 900);
}
function rollback(){ const s=S.lastSwap; if(!s) return; S.roles[s.role]=s.prev; S.lastSwap=null; render(); toast(`${s.role[0].toUpperCase()+s.role.slice(1)} rolled back to ${modelName(s.prev)}.`); }

CSV file. Ship a small shell script, fans-log.sh, that wraps it for the lab.

- Arguments: --target, --duration (default 2m), --out (default fans.csv)

// Toolchains shipped in the offline bundle. Users pick a language; the version is optional and
// the agent resolves the best available one unless the user pins it.
const TOOLCHAINS = {
  "Python":            { versions:["3.11","3.12"],               pick:"3.12",      note:"uv, ruff, mypy, pytest" },
  "C":                 { versions:["gcc 12","gcc 13","clang 17"], pick:"gcc 13",    note:"make, cmake, gdb, cppcheck" },
  "C++":               { versions:["gcc 12","gcc 13","clang 17"], pick:"gcc 13",    note:"cmake, ninja, gtest, clang-tidy" },
  "Rust":              { versions:["1.79","1.80"],               pick:"1.80",      note:"cargo, clippy, rustfmt" },
  "Shell":             { versions:["bash 5.2","POSIX sh"],        pick:"bash 5.2",  note:"shellcheck, bats" },
  "Go":                { versions:["1.22"],                      pick:"1.22",      note:"go test, golangci-lint" },
  "TypeScript":        { versions:["Node 20"],                   pick:"Node 20",   note:"pnpm, vitest, eslint" },
  "YAML / JSON config":{ versions:[],                            pick:"schema checks", note:"yamllint, jsonschema, JSON Schema validation" },
};
function matchVersion(t, want){ const w=(want||"").trim().toLowerCase(); if(!w) return null; return t.versions.find(v=>{ const x=v.toLowerCase(); return x===w || x.endsWith(" "+w) || x.includes(w) || w.includes(x); })||null; }
function resolveToolchain(d){
  return (d.langs||[]).map(l=>{ const t=TOOLCHAINS[l]; const want=(d.versions&&d.versions[l]||"").trim(); const hit=t.versions.length?matchVersion(t,want):null;
    return { lang:l, version: hit||t.pick, pinned:!!hit, requested:want, unavailable: !!want && !hit && t.versions.length>0 }; });
}
function toolchainLabel(r){ if(r.lang==="YAML / JSON config") return "YAML/JSON config"; return /^\d/.test(r.version) ? `${r.lang} ${r.version}` : `${r.lang} (${r.version})`; }
function wizReadVersions(){ const d=S.wiz&&S.wiz.data; if(!d) return; d.versions=d.versions||{}; document.querySelectorAll(".w-ver").forEach(i=>{ d.versions[i.dataset.lang]=i.value; }); }
function wizToggleLang(l){ wizReadVersions(); const d=S.wiz.data; d.langs = d.langs.includes(l) ? d.langs.filter(x=>x!==l) : [...d.langs,l]; paintWizard(); }
function detectLangs(plan){ const p=(plan||"").toLowerCase(); const out=[]; if(/python|\.py\b|pytest|pip|uv\b/.test(p)) out.push("Python"); if(/\bc\+\+|cpp|cmake/.test(p)) out.push("C++"); else if(/\bgcc\b|\.c\b|firmware|register/.test(p)) out.push("C"); if(/rust|cargo/.test(p)) out.push("Rust"); if(/\bbash\b|\bshell\b|\.sh\b|shell script/.test(p)) out.push("Shell"); if(/yaml|json|config/.test(p)) out.push("YAML / JSON config"); if(/typescript|node|react/.test(p)) out.push("TypeScript"); if(/\bgo\b|golang/.test(p)) out.push("Go"); return out.length?out:["Python"]; }

        validate:d=> d.target ? null : "Pick a free server." },
      { name:"Review and approve",
        render:d=>{ const dc=d.items.find(i=>i.item==="DC power cycle"), ac=d.items.find(i=>i.item==="AC power cycle"), st=d.items.find(i=>i.item==="Storage stress");
          return `<p class="sentence">This will power-cycle <strong>${esc(d.target)}</strong> <strong>${dc?dc.count:0} times</strong> through the BMC${ac?` and <strong>${ac.count} times</strong> through the PDU (mains off and on)`:""}${st?`, and run a 30-minute storage stress`:""}. About <strong>3.5 hours</strong> in total. After every cycle the hardware is compared against a baseline taken first. Nothing is written to firmware. The run stops on its own after 3 consecutive boot failures.</p>
          ${ac?`<div class="notice warn" style="margin-top:10px"><strong>AC power cycle is destructive.</strong> The BMC restarts too, so its event log is saved before each cycle. Approving this step is recorded with your name.</div>`:""}
          <div class="hr"></div>
          <h2 style="font-size:13.5px;margin-bottom:8px">Plan cross-check</h2>
          ${consensus([
            {who:"Qwen Coder 32B",    ok:true, why:"All steps use approved actions. Cycle counts are within policy."},
            {who:"DeepSeek Coder V2", ok:true, why:"Matches the suite. Baseline checks cover every device class."},
            {who:"Kimi Dev 72B",      ok:true, why:"Settle times meet the guardrail minimums (10 s DC, 30 s AC)."},
          ], "3 of 3 models agree the compiled plan is safe and matches your suite.")}
          <div class="hr"></div>
          <p class="muted">Guardrails: 10 s minimum settle, 30 s after AC, 15 min boot timeout, abort after 3 consecutive failures, exclusive lease on ${esc(d.target)}, 72 h maximum.</p>`; } },
    ],
    done:d=>{ const dc=d.items.find(i=>i.item==="DC power cycle"), ac=d.items.find(i=>i.item==="AC power cycle"); S.queue.push({ id:419, target:d.target, summary:`DC cycle × ${dc?dc.count:0}${ac?`, AC cycle × ${ac.count}`:""}, storage stress`, eta:"3.5 hours" }); setPage("validation"); toast(`Run 419 approved and queued for ${d.target}. Ticket V-419 created.`); },
  },

  factory: {
    title:"New factory job", finish:"Start job",
    defaults:()=>({ trigger:"scan", sn:"7K2-00419", mes:"F-2292", station:8, template:"Final test", voters:"3 models (recommended)", onFail:"Hold the station and draft a ticket for the line lead", backup:true }),
    steps:[
      { name:"Trigger",
        render:d=>`<p class="muted" style="margin-bottom:10px">How does this job start? On the line, scanning the label is the normal path; the other two are for re-tests and manual runs.</p>
          <div class="stack" style="gap:6px">
            ${[["scan","Scan a unit label","The ticket opens with the serial number."],["mes","Enter a production ticket number","Pulls the unit and test plan from the production system."],["manual","Pick a station manually","For engineering runs outside the line."]].map(([k,t,s])=>`<label class="row" style="padding:10px 12px;border:1px solid ${d.trigger===k?"var(--accent)":"var(--rule)"};border-radius:var(--r-ctl);cursor:pointer;align-items:flex-start"><input type="radio" name="w-trig" ${d.trigger===k?"checked":""} onchange="S.wiz.data.trigger='${k}';paintWizard()" style="margin-top:3px"><span><strong>${t}</strong><div class="muted">${s}</div></span></label>`).join("")}
          </div>
          <div class="cols cols-2" style="gap:10px;margin-top:12px">
            ${d.trigger==="scan"?`<div><label class="field">Serial number</label><input id="w-sn" style="width:100%" value="${esc(d.sn)}"></div>`:""}
            ${d.trigger==="mes"?`<div><label class="field">Production ticket</label><input id="w-mes" style="width:100%" value="${esc(d.mes)}"></div>`:""}
            <div><label class="field">Station</label><select id="w-station" style="width:100%">${STATIONS.map(s=>`<option value="${s.n}" ${s.state!=="free"?"disabled":""} ${d.station===s.n?"selected":""}>Station ${s.n}${s.state==="free"?"":" — "+s.state}</option>`).join("")}</select></div>
          </div>`,
        collect:d=>{ const sn=$("#w-sn"), mes=$("#w-mes"); if(sn) d.sn=sn.value.trim(); if(mes) d.mes=mes.value.trim(); d.station=+$("#w-station").value; },
        validate:d=> (d.trigger==="scan"&&!d.sn) ? "Scan or type the serial number." : (d.trigger==="mes"&&!d.mes) ? "Enter the production ticket number." : null },
      { name:"Test loop",
        render:d=>{ const steps=FACTORY_TEMPLATES[d.template]; return `<label class="field">Template</label><select id="w-tpl" style="width:100%;margin-bottom:12px" onchange="S.wiz.data.template=this.value;paintWizard()">${Object.keys(FACTORY_TEMPLATES).map(t=>`<option ${t===d.template?"selected":""}>${t}</option>`).join("")}</select>
          <p class="sentence" style="margin-bottom:6px">${steps.length} steps on station ${d.station}. Steps that use the station screen are done through the station runner; you can watch and take over at any time.</p>
          <ul class="plain steps">${steps.map((s,i)=>`<li><span class="s"></span><span>${esc(s)}</span><span class="faint">${/GUI|window|login screen/i.test(s)?"screen":/SSH|sensor|event log|serial/i.test(s)?"commands":"power"}</span></li>`).join("")}</ul>
          <div class="hr"></div>
          <label class="field">Skills used by this template</label>
          <div class="row wrap" style="gap:6px">${S.skills.filter(s=>s.agents.factory).map(s=>`<span class="chip on">${esc(s.name)}</span>`).join("")||`<span class="muted">None enabled for the factory agent.</span>`}</div>`; } },
      { name:"Verdict rules",
        render:d=>`<div class="cols cols-2" style="gap:12px">
            <div><label class="field">Who decides pass or fail</label><select id="w-voters" style="width:100%">${["3 models (recommended)","5 models"].map(o=>`<option ${o===d.voters?"selected":""}>${o}</option>`).join("")}</select><p class="faint" style="margin-top:4px">All must agree for a pass. Otherwise the line lead decides.</p></div>
            <div><label class="field">If a test fails</label><select id="w-onfail" style="width:100%">${["Hold the station and draft a ticket for the line lead","Continue to the next unit and draft a ticket"].map(o=>`<option ${o===d.onFail?"selected":""}>${o}</option>`).join("")}</select></div>
          </div>
          <div class="hr"></div>
          <label class="field">When the loop finishes</label>
          <div class="row wrap" style="gap:6px"><span class="chip on" title="Always both">Export SOP in English</span><span class="chip on" title="Always both">匯出中文 SOP</span><span class="chip ${d.backup?"on":""}" id="w-backup" onclick="this.classList.toggle('on')">Back up the station state</span><span class="chip on">Return the verdict to the production system</span></div>
          <div class="hr"></div>
          <p class="sentence">This will run the <strong>${esc(d.template.toLowerCase())}</strong> loop, ${FACTORY_TEMPLATES[d.template].length} steps, on <strong>station ${d.station}</strong> for unit <strong>${esc(d.trigger==="mes"?"from ticket "+d.mes:d.sn)}</strong>. The unit is marked passed only if ${d.voters.startsWith("5")?"all 5":"all 3"} reviewing models agree. A ticket is created now.</p>`,
        collect:d=>{ d.voters=$("#w-voters").value; d.onFail=$("#w-onfail").value; d.backup=$("#w-backup").classList.contains("on"); } },
    ],
    done:d=>{ const steps=FACTORY_TEMPLATES[d.template]; S.factory={ ticket:d.trigger==="mes"?d.mes:"F-2292", station:d.station, sn:d.trigger==="mes"?"7K2-00419":d.sn, test:1, total:steps.length, template:d.template, steps, fresh:true,
        source: d.trigger==="scan"?"opened from a label scan":d.trigger==="mes"?"from the production system":"opened manually",
        feed:[[hhmmss(S.clock),`Ticket created. Station ${d.station} leased. Powering on the unit.`],["now",`<span class="muted">Waiting for the login screen (up to 5 minutes)…</span>`]] };
      setPage("factory"); toast(`Job started on station ${d.station}. Ticket ${S.factory.ticket} created.`); },
  },
};

function openWizard(kind){ S.wiz={ kind, step:0, data:WIZ[kind].defaults() }; paintWizard(); }
function paintWizard(){
  const w=S.wiz; if(!w) return; const def=WIZ[w.kind]; const total=def.steps.length; const st=def.steps[w.step];
  dialog(`<h3>${def.title} <span class="muted" style="font-weight:400">— step ${w.step+1} of ${total}: ${st.name}</span></h3>
    <div class="progress" style="margin:8px 0 14px"><i style="width:${Math.round((w.step+1)/total*100)}%"></i></div>
    ${st.render(w.data)}
    <div class="actions">${w.step>0?`<button class="btn" onclick="wizBack()">Back</button>`:`<button class="btn" onclick="closeWizard()">Cancel</button>`}<button class="btn primary" onclick="wizNext()">${w.step===total-1?def.finish:"Next"}</button></div>`,{wide:true});
}
function wizBack(){ const st=WIZ[S.wiz.kind].steps[S.wiz.step]; if(st.collect) try{ st.collect(S.wiz.data); }catch(e){} S.wiz.step--; paintWizard(); }
function wizNext(){
  const w=S.wiz; const def=WIZ[w.kind]; const st=def.steps[w.step];
  if(st.collect) st.collect(w.data);
  if(st.validate){ const err=st.validate(w.data); if(err){ toast(err); return; } }
  if(w.step<def.steps.length-1){ w.step++; paintWizard(); }
  else { const d=w.data; S.wiz=null; closeDialog(); def.done(d); }
}
function closeWizard(){ S.wiz=null; closeDialog(); }

/* ── Boot ──────────────────────────────────────────────────────────────── */
const hash=(location.hash||"").slice(1); if(PAGES.some(([k])=>k===hash)) S.page=hash;
render();
setInterval(tick, 3200);
</script>
</body>
