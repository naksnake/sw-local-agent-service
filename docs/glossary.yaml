# Project glossary for SW Local Agent Service (CLAUDE.md §5.5, §14).
# Rendered from slas_sop.glossary.DEFAULT_GLOSSARY; a unit test keeps file and code in
# step. Every translation pins these renderings; the renderer and the eval suite verify
# them. Identifiers, commands, numbers and versions are never translated (INV-13).
version: 1
default_chinese: zh-Hant
terms:
  - en: "power cycle"
    zh_hant: "電源循環"
    zh_hans: "电源循环"
    avoid: ["重新上電", "斷電重啟"]
  - en: "AC cycle"
    zh_hant: "AC 電源循環"
    zh_hans: "AC 电源循环"
    note: "The BMC cycles too."
  - en: "DC cycle"
    zh_hant: "DC 電源循環"
    zh_hans: "DC 电源循环"
    note: "The BMC stays up."
  - en: "warm boot"
    zh_hant: "暖開機"
    zh_hans: "暖开机"
    avoid: ["熱啟動"]
  - en: "baseline"
    zh_hant: "基準"
    zh_hans: "基准"
    avoid: ["基線", "底線"]
  - en: "target"
    zh_hant: "受測機"
    zh_hans: "受测机"
    note: "The server under test (SUT)."
