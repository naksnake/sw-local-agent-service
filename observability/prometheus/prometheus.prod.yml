# Rendered from slas_observability (CLAUDE.md §8.2, P11); a unit test keeps file and
# code in step. Edit the Python, then run `uv run python -m slas_observability.render`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/rules.yml
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
scrape_configs:
  - job_name: slas-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000
        labels:
          service: api
      - targets:
          - agent-core-orchestrator:8000
        labels:
          service: agent-core-orchestrator
      - targets:
          - llm-gateway:8000
        labels:
          service: llm-gateway
      - targets:
          - model-manager:8000
        labels:
          service: model-manager
      - targets:
          - sandbox-manager:8000
        labels:
          service: sandbox-manager
      - targets:
          - screen-worker:8000
        labels:
          service: screen-worker
      - targets:
          - git-broker:8000
        labels:
          service: git-broker
      - targets:
          - validation-executor:8000
        labels:
          service: validation-executor
      - targets:
          - factory-executor:8000
        labels:
          service: factory-executor
  - job_name: vllm
    metrics_path: /metrics
    static_configs:
      - targets:
          - vllm-coder:8000
        labels:
          role: coder
      - targets:
          - vllm-planner:8000
        labels:
          role: planner
      - targets:
          - vllm-triage:8000
        labels:
          role: triage
      - targets:
          - vllm-embed:8000
        labels:
          role: embed
      - targets:
          - vllm-rerank:8000
        labels:
          role: rerank
      - targets:
          - vllm-voter-deepseek-v4-flash:8000
        labels:
          role: voter
          voter: deepseek-v4-flash
      - targets:
          - vllm-voter-qwen3.8-27b-fp8:8000
        labels:
          role: voter
          voter: qwen3.8-27b-fp8
      - targets:
          - vllm-voter-minimax-m2.7:8000
        labels:
          role: voter
          voter: minimax-m2.7
  - job_name: dcgm
    static_configs:
      - targets:
          - dcgm-exporter:9400
  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
  - job_name: postgres
    static_configs:
      - targets:
          - postgres-exporter:9187
  - job_name: prometheus
    static_configs:
      - targets:
          - localhost:9090
