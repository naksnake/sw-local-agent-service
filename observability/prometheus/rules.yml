# Rendered from slas_observability (CLAUDE.md §8.2, P11); a unit test keeps file and
# code in step. Edit the Python, then run `uv run python -m slas_observability.render`.
groups:
  - name: slas-recording
    interval: 30s
    rules:
      - record: slas:consensus_agreement_ratio:1h
        expr: "1 - (sum(increase(slas_consensus_disagreements_total[1h])) / clamp_min(sum(increase(slas_consensus_votes_total[1h])) / 3, 1))"
      - record: slas:screen_step_failure_ratio:15m
        expr: "sum(rate(slas_screen_steps_total{outcome!=\"ok\"}[15m])) / clamp_min(sum(rate(slas_screen_steps_total[15m])), 0.001)"
      - record: slas:gateway_error_ratio:15m
        expr: "sum(rate(slas_gateway_requests_total{outcome!=\"ok\"}[15m])) / clamp_min(sum(rate(slas_gateway_requests_total[15m])), 0.001)"
      - record: slas:gpu_memory_used_ratio
        expr: "DCGM_FI_DEV_FB_USED / clamp_min(DCGM_FI_DEV_FB_USED + DCGM_FI_DEV_FB_FREE, 1)"
  - name: slas-inference
    rules:
      - alert: SlasVllmInstanceDown
        expr: "up{job=\"vllm\"} == 0"
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "The model instance {{ $labels.instance }} ({{ $labels.role }}) is not answering Prometheus."
          likely_cause: "The vLLM container stopped, is still loading weights, or ran out of GPU memory."
          what_to_do: "Open Models; if the instance shows as stopped, `slas model fit` and start it again. Roles routed to it fall back per §11 tiers."
      - alert: SlasCircuitBreakerOpen
        expr: "slas_breaker_open == 1"
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "The circuit breaker paused the model instance {{ $labels.instance }}."
          likely_cause: "Two answers in a row were invalid or the instance did not answer; requests fall back to another instance or a person for the cooldown."
          what_to_do: "Check the instance on the Models page and its GPU on the GPU dashboard. The breaker retries by itself after the cooldown."
      - alert: SlasCircuitBreakerFlapping
        expr: "increase(slas_breaker_trips_total[1h]) >= 3"
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "The circuit breaker opened {{ $value }} times in an hour for {{ $labels.instance }}."
          likely_cause: "The instance keeps returning invalid JSON or timing out: a model that ignores guided decoding, or a GPU that is too small."
          what_to_do: "Swap the role to a model from the registry that passed the eval gates (`slas model swap`), then watch this dashboard."
      - alert: SlasGatewayErrors
        expr: "slas:gateway_error_ratio:15m > 0.05"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of gateway requests failed in the last 15 minutes."
          likely_cause: "Schema violations, paused instances or vLLM not answering."
          what_to_do: "Open the Inference dashboard: the outcome panel says which. Schema violations point at the model; unavailability at the instance."
      - alert: SlasInferenceQueueDeep
        expr: "vllm:num_requests_waiting > 16"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} requests are waiting on {{ $labels.instance }}."
          likely_cause: "More agents than the instance can serve, or a long prompt holding the KV cache."
          what_to_do: "Let it drain, or give the role a second instance from the Models page. Do not restart: waiting requests would be lost."
  - name: slas-consensus
    rules:
      - alert: SlasConsensusDisagreement
        expr: "increase(slas_consensus_disagreements_total[10m]) > 0"
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "The voters did not agree on {{ $labels.decision }}; a person decides."
          likely_cause: "The evidence is ambiguous, or one voter's judgement differs from the others'."
          what_to_do: "Open the ticket: the votes and each concern are shown as sentences. Decide, and note why."
      - alert: SlasConsensusDegraded
        expr: "increase(slas_consensus_degraded_total[1h]) > 0"
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Cross-checks on {{ $labels.decision }} ran with fewer voters than the rule asks for."
          likely_cause: "A voter is paused by the breaker, or today's cross-check budget is used up."
          what_to_do: "Check the breaker and budget panels on the Inference dashboard. Decisions taken meanwhile are flagged on their tickets."
      - alert: SlasConsensusBudgetExhausted
        expr: "slas_consensus_budget_remaining_tokens == 0"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Today's cross-check budget is used up."
          likely_cause: "More cross-checks than the 5 % daily budget allows."
          what_to_do: "Nothing is blocked: checks run on one model and are flagged. Raise CONSENSUS_TOKEN_BUDGET_PCT only with a reason."
  - name: slas-gpu
    rules:
      - alert: SlasGpuHot
        expr: "DCGM_FI_DEV_GPU_TEMP > 85"
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} is at {{ $value }} °C."
          likely_cause: "Sustained load with poor airflow, or a failed fan."
          what_to_do: "Check the host's fans and inlet temperature; if it keeps climbing, drain the role from this GPU on the Models page."
      - alert: SlasGpuMemoryNearlyFull
        expr: "slas:gpu_memory_used_ratio > 0.97"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "GPU {{ $labels.gpu }} memory is {{ $value | humanizePercentage }} used."
          likely_cause: "Two roles co-reside on the GPU, or the context length is larger than the fit assumed."
          what_to_do: "Run `slas model fit` for the roles on this GPU; move one or lower its context."
      - alert: SlasGpuXidErrors
        expr: "increase(DCGM_FI_DEV_XID_ERRORS[15m]) > 0"
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "GPU {{ $labels.gpu }} reported Xid errors."
          likely_cause: "A driver fault, a hardware fault, or an application crash on the GPU."
          what_to_do: "Read dmesg on the platform host for the Xid code; the instance on this GPU may need a restart. Record it as a ticket."
  - name: slas-agents
    rules:
      - alert: SlasStepFailures
        expr: "increase(slas_agent_turns_total{outcome=\"failed\"}[30m]) > 5"
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} plan steps failed for the {{ $labels.agent }} agent in 30 minutes."
          likely_cause: "A target, station or sandbox is misbehaving, or a plan relies on something that is down."
          what_to_do: "Open Tickets filtered on Needs review; each failed step has its observation and screenshots."
      - alert: SlasTicketsWaiting
        expr: "sum(slas_tickets_in_state{state=\"Needs review\"}) > 10"
        for: 1h
        labels:
          severity: info
        annotations:
          summary: "{{ $value }} tickets wait for a person's review."
          likely_cause: "Reviews are behind the agents."
          what_to_do: "Open Tickets → Needs review and work the oldest first."
  - name: slas-sandboxes-screens
    rules:
      - alert: SlasSandboxesAtCapacity
        expr: "slas_sandbox_sessions_open >= 8"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} sandboxes are open on this host."
          likely_cause: "Many coding tasks at once, or sessions past their TTL that were not reaped."
          what_to_do: "Check the Coding page for idle sessions; the reaper closes expired ones every minute."
      - alert: SlasDisplaysAtCapacity
        expr: "slas_screen_displays_open >= 8"
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Every virtual display in the screen worker is in use."
          likely_cause: "Eight GUI sessions at once (DISPLAYS_PER_WORKER)."
          what_to_do: "Wait for a session to end, or add a screen worker in the prod profile."
      - alert: SlasScreenStepFailures
        expr: "slas:screen_step_failure_ratio:15m > 0.2"
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of GUI steps failed in the last 15 minutes."
          likely_cause: "Window titles or timing on a station changed, or a window stole the focus."
          what_to_do: "Read the before/after screenshots on the ticket; tune the station under Admin → Stations (window matching, settle time)."
      - alert: SlasScreenStopped
        expr: "increase(slas_screen_steps_total{outcome=\"stopped\"}[15m]) > 0"
        for: 0m
        labels:
          severity: info
        annotations:
          summary: "A GUI step was stopped: an operator took over or the focus changed unexpectedly."
          likely_cause: "Take-over from the VNC view, a denied window, or a focus change."
          what_to_do: "Nothing if an operator took over on purpose; otherwise read the step's sentence on the ticket."
  - name: slas-validation
    rules:
      - alert: SlasValidationBootFailures
        expr: "increase(slas_validation_cycles_total{outcome=\"boot_failed\"}[1h]) >= 3"
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "{{ $value }} boot failures in an hour during {{ $labels.kind }} cycling."
          likely_cause: "The target does not come back after a power action: firmware, a device, or the fixture."
          what_to_do: "The run aborts by itself after three in a row. Look at the target's console on the Validation page before arming it again."
      - alert: SlasValidationRunAborted
        expr: "increase(slas_validation_runs_total{outcome=\"aborted\"}[1h]) > 0"
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "A validation run was aborted by a guardrail."
          likely_cause: "Consecutive boot failures or the maximum run time."
          what_to_do: "Open the run's ticket; the finding names the guardrail."
  - name: slas-factory
    rules:
      - alert: SlasFactoryStationHeld
        expr: "slas_factory_stations_held > 0"
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value }} station(s) have been held for a line lead for 15 minutes."
          likely_cause: "A unit failed or the voters split, and nobody has decided."
          what_to_do: "Open Factory: the held job shows the draft ticket and the Decide buttons."
      - alert: SlasFactoryFailRate
        expr: "sum(increase(slas_factory_verdicts_total{verdict=\"FAIL\"}[2h])) / clamp_min(sum(increase(slas_factory_verdicts_total[2h])), 1) > 0.3"
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "{{ $value | humanizePercentage }} of units failed in the last two hours."
          likely_cause: "A bad lot, a station drifting out of calibration, or a test-loop template change."
          what_to_do: "Compare the stations on the Factory dashboard; if one stands out, check its backup and sensors."
      - alert: SlasStationUnreachable
        expr: "increase(slas_station_batches_total{ok=\"false\"}[15m]) > 3"
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "Batches to {{ $labels.station }} keep failing."
          likely_cause: "The station runner is down, its certificate expired, or the factory network is cut."
          what_to_do: "On the station: `slas-station-runner doctor`. On the platform: Admin → Stations shows when it was last seen."
