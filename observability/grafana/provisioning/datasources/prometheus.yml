# Rendered from slas_observability (CLAUDE.md §8.2, P11); a unit test keeps file and
# code in step. Edit the Python, then run `uv run python -m slas_observability.render`.
apiVersion: 1
datasources:
  - name: Prometheus
    type: prometheus
    uid: slas-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
      httpMethod: POST
