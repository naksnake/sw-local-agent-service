[project]
name = "slas-skills"
version = "0.0.1"
description = "Skill import, validate, compile, run, export"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["slas-observability", "slas-schemas", "slas-authz", "slas-screen"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
slas-observability = { workspace = true }
slas-schemas = { workspace = true }
slas-authz = { workspace = true }
slas-screen = { workspace = true }
