[project]
name = "slas-cli"
version = "0.0.1"
description = "The `slas` command line, mirroring the WebUI"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["slas-observability", "slas-hal", "slas-kernel", "slas-sandbox-manager", "slas-schemas"]

[project.scripts]
slas = "slas_cli.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
slas-deploy = { workspace = true }
slas-observability = { workspace = true }
slas-hal = { workspace = true }
slas-kernel = { workspace = true }
slas-sandbox-manager = { workspace = true }
slas-schemas = { workspace = true }
