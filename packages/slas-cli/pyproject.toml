[project]
name = "slas-cli"
version = "0.0.0"
description = "The `slas` command line (CLAUDE.md §3)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Standard library only on purpose: the preflight runs before anything is installed.
dependencies = []

[project.scripts]
slas = "slas_cli.cli:main"

[build-system]
requires = ["uv_build>=0.8.17,<0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "slas_cli"
module-root = ""
