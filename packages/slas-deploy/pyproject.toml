[project]
name = "slas-deploy"
version = "0.0.1"
description = "The compose files, image lock, cosign verification, Keycloak realm, Vault policies, pgBackRest configuration and the restore drill, rendered from code"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["slas-hal", "slas-observability", "slas-schemas"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
slas-hal = { workspace = true }
slas-observability = { workspace = true }
slas-schemas = { workspace = true }
