[project]
name = "slas-screen"
version = "0.0.1"
description = "Screen driver: PyAutoGUI + xdotool behind our interface, screenshot before/after, rate limit, deny-list"
readme = "README.md"
requires-python = ">=3.12,<3.13"
# PyAutoGUI (text and image search) is added once approved; xdotool is a system tool used
# by argv only. Tests run against FakeScreen.
dependencies = ["slas-schemas"]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.uv.sources]
slas-schemas = { workspace = true }
