# Models/models.yaml for the prod profile of SW Local Agent Service (CLAUDE.md §7).
# Rendered from slas_model_manager.registry.PROFILE_REGISTRIES['prod']; a unit test
# keeps file and code in step. install.sh copies this file to ${SLAS_DATA_ROOT}/Models/
# models.yaml when none exists there yet, and never overwrites one (INV-9).
# Every `path` is a directory under Models/ that scripts/fetch_models.py fetches from the
# matching line of config/model-sources.txt; never a URL (INV-1).
# Assumes GPUs of about 288 GB each (HGX B300 class); on smaller GPUs pick smaller or
# AWQ builds on the Models page. The model manager starts one instance per role and one
# per voter. vram_gib is the weights on the hub plus headroom for the KV cache at
# `context`; an assumption until real instances run. Change roles on the Models page or
# here; no restart is needed.
# Three voters from three families (DeepSeek, Qwen, MiniMax); DeepSeek-V4 Pro serves
# the planner only, tensor parallel over four GPUs.
version: 1
models:
  - id: deepseek-v4-pro
    display_name: "DeepSeek-V4 Pro"
    family: "DeepSeek"
    path: "deepseek-v4-pro"
    quant: fp8
    vram_gib: 900
    context: 131072
    roles: [planner]
  - id: deepseek-v4-flash
    display_name: "DeepSeek-V4 Flash"
    family: "DeepSeek"
    path: "deepseek-v4-flash"
    quant: fp8
    vram_gib: 180
    context: 131072
    roles: [triage, planner]
  - id: qwen3.8-27b-fp8
    display_name: "Qwen3.8-27B"
    family: "Qwen"
    path: "qwen3.8-27b-fp8"
    quant: fp8
    vram_gib: 40
    context: 131072
    roles: [coder, planner]
  - id: minimax-m2.7
    display_name: "MiniMax-M2.7"
    family: "MiniMax"
    path: "minimax-m2.7"
    quant: fp8
    vram_gib: 235
    context: 131072
    roles: [planner]
  - id: qwen3.8-27b-bf16
    display_name: "Qwen3.8-27B (BF16 reference)"
    family: "Qwen"
    path: "qwen3.8-27b-bf16"
    quant: bf16
    vram_gib: 64
    context: 131072
    roles: []
  - id: bge-m3
    display_name: "BGE-M3"
    family: "BAAI"
    path: "bge-m3"
    quant: bf16
    vram_gib: 3
    context: 8192
    roles: [embed]
  - id: bge-reranker-v2-m3
    display_name: "BGE Reranker v2 M3"
    family: "BAAI"
    path: "bge-reranker-v2-m3"
    quant: bf16
    vram_gib: 2
    context: 8192
    roles: [rerank]
roles:
  coder: qwen3.8-27b-fp8
  planner: deepseek-v4-pro
  triage: deepseek-v4-flash
  embed: bge-m3
  rerank: bge-reranker-v2-m3
voters:
  - deepseek-v4-flash
  - qwen3.8-27b-fp8
  - minimax-m2.7
