# Models/models.yaml for the quickstart profile of SW Local Agent Service (CLAUDE.md §7).
# Rendered from slas_model_manager.registry.PROFILE_REGISTRIES['quickstart']; a unit test
# keeps file and code in step. install.sh copies this file to ${SLAS_DATA_ROOT}/Models/
# models.yaml when none exists there yet, and never overwrites one (INV-9).
# Every `path` is a directory under Models/ that scripts/fetch_models.py fetches from the
# matching line of config/model-sources.txt; never a URL (INV-1).
# vram_gib is the weights on the hub plus headroom for the KV cache at `context`; it is
# an assumption until real instances run. DeepSeek-V4 Pro runs tensor parallel over
# four GPUs. Change roles on the Models page or here; no restart is needed.
version: 1
models:
  - id: deepseek-v4-flash
    display_name: "DeepSeek-V4 Flash"
    family: "DeepSeek"
    path: "deepseek-v4-flash"
    quant: fp8
    vram_gib: 180
    context: 131072
    roles: [triage, planner]
  - id: qwen3.8-27b-fp8
    display_name: "Qwen3.8-27B"
    family: "Qwen"
    path: "qwen3.8-27b-fp8"
    quant: fp8
    vram_gib: 40
    context: 131072
    roles: [coder, planner]
  - id: bge-m3
    display_name: "BGE-M3"
    family: "BAAI"
    path: "bge-m3"
    quant: bf16
    vram_gib: 3
    context: 8192
    roles: [embed]
  - id: bge-reranker-v2-m3
    display_name: "BGE Reranker v2 M3"
    family: "BAAI"
    path: "bge-reranker-v2-m3"
    quant: bf16
    vram_gib: 2
    context: 8192
    roles: [rerank]
roles:
  coder: qwen3.8-27b-fp8
  planner: qwen3.8-27b-fp8
  triage: deepseek-v4-flash
  embed: bge-m3
  rerank: bge-reranker-v2-m3
voters:
  - deepseek-v4-flash
  - qwen3.8-27b-fp8
