# pgBackRest for SW Local Agent Service, prod profile (CLAUDE.md §8.4, ADR-0012).
# Rendered from slas_deploy.pgbackrest; a unit test keeps file and code in step.
# The repository is MinIO on the backend network with object lock (compliance mode):
# a backup cannot be deleted before its retention, by anyone. Credentials come from
# Docker secret files, never from this file.
[global]
repo1-type=s3
repo1-s3-endpoint=minio:9000
repo1-s3-bucket=slas-backups
repo1-s3-region=us-east-1
repo1-s3-uri-style=path
repo1-s3-verify-tls=n
repo1-s3-key-file=/run/secrets/pgbackrest_s3_key
repo1-s3-key-secret-file=/run/secrets/pgbackrest_s3_secret
repo1-path=/pgbackrest
repo1-retention-full=4
repo1-retention-diff=14
repo1-retention-archive-type=full
repo1-cipher-type=none
process-max=4
compress-type=zst
compress-level=3
archive-async=y
spool-path=/var/spool/pgbackrest
log-level-console=info
log-level-file=off
start-fast=y
delta=y

[slas]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-socket-path=/var/run/postgresql
