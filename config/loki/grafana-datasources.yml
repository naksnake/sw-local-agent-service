# Grafana datasources for Loki and Tempo (prod). Rendered from
# slas_deploy.observability_prod; a unit test keeps file and code in step.
apiVersion: 1
datasources:
  - name: Loki
    type: loki
    uid: slas-loki
    access: proxy
    url: http://loki:3100
    editable: false
    jsonData:
      derivedFields:
        - name: trace_id
          matcherRegex: "\"trace_id\": ?\"([0-9a-f]{32})\""
          url: "${__value.raw}"
          datasourceUid: slas-tempo
  - name: Tempo
    type: tempo
    uid: slas-tempo
    access: proxy
    url: http://tempo:3200
    editable: false
    jsonData:
      tracesToLogsV2:
        datasourceUid: slas-loki
        filterByTraceID: true
      serviceMap:
        datasourceUid: slas-prometheus
