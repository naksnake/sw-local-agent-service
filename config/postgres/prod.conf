# PostgreSQL settings the prod profile adds (ADR-0012): continuous archiving through
# pgBackRest for point-in-time recovery. Rendered from slas_deploy.pgbackrest; a unit
# test keeps file and code in step. Everything else stays at the image's defaults.
listen_addresses = '*'
max_connections = 200
wal_level = replica
archive_mode = on
archive_command = 'pgbackrest --stanza=slas archive-push %p'
archive_timeout = 300
max_wal_senders = 3
wal_keep_size = 512MB
checkpoint_timeout = 15min
log_destination = 'stderr'
log_line_prefix = '%m [%p] %q%u@%d '
log_min_duration_statement = 2000
shared_preload_libraries = 'pg_stat_statements'
