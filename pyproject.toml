# Workspace root for SW Local Agent Service (CLAUDE.md §11, §13).
# Python 3.12 · uv · ruff · mypy --strict · pytest. Every version below is pinned (INV-8).

[project]
name = "slas-workspace"
version = "0.0.1"
description = "SW Local Agent Service — workspace root (not a package)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "slas-authz",
  "slas-cli",
  "slas-diff",
  "slas-eval",
  "slas-git",
  "slas-hal",
  "slas-kernel",
  "slas-rag",
  "slas-schemas",
  "slas-screen",
  "slas-skills",
  "slas-sop",
  "slas-triage",
]

[dependency-groups]
dev = [
  "mypy==2.3.1",
  "pytest==9.1.1",
  "pytest-cov==7.1.0",
  "ruff==0.16.7",
]

[tool.uv]
package = false

[tool.uv.workspace]
# apps/api and services/* join the workspace when they gain a pyproject (P1, P2).
members = ["packages/*"]

[tool.uv.sources]
slas-authz = { workspace = true }
slas-cli = { workspace = true }
slas-diff = { workspace = true }
slas-eval = { workspace = true }
slas-git = { workspace = true }
slas-hal = { workspace = true }
slas-kernel = { workspace = true }
slas-rag = { workspace = true }
slas-schemas = { workspace = true }
slas-screen = { workspace = true }
slas-skills = { workspace = true }
slas-sop = { workspace = true }
slas-triage = { workspace = true }

# --- ruff -------------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"
# Markdown is excluded on purpose: ruff would reformat the code blocks in CLAUDE.md and the
# ADRs, and CLAUDE.md changes only by decision (CLAUDE.md §15).
extend-exclude = [".venv", ".uv-cache", "node_modules", "apps/webui", "*.md"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "N",        # pep8-naming
  "UP",       # pyupgrade
  "B",        # bugbear
  "S",        # bandit — catches shell=True and friends (CLAUDE.md §11)
  "SIM",      # simplify
  "C4",       # comprehensions
  "RUF",      # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S603", "S607"]  # asserts and subprocess in tests are fine

[tool.ruff.lint.isort]
known-first-party = [
  "slas_authz", "slas_cli", "slas_diff", "slas_eval", "slas_git", "slas_hal", "slas_kernel",
  "slas_rag", "slas_schemas", "slas_screen", "slas_skills", "slas_sop", "slas_triage",
]

# --- mypy -------------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["packages", "tests"]

# --- pytest / coverage ---------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = [
  "-q",
  "--strict-markers",
  "--cov=slas_cli",
  "--cov=slas_kernel",
  "--cov=slas_schemas",
  "--cov-report=term-missing",
  "--cov-fail-under=85",
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
skip_empty = true
exclude_also = ["if TYPE_CHECKING:", "\\.\\.\\.$"]
