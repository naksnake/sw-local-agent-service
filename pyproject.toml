[project]
name = "slas-workspace"
version = "0.0.0"
description = "SW Local Agent Service: uv workspace root (not a package)"
requires-python = ">=3.12,<3.13"
dependencies = []

[dependency-groups]
# Tooling named in CLAUDE.md §11. Exact pins: INV-8.
dev = [
  "pytest==9.0.2",
  "ruff==0.15.8",
  "mypy==1.19.1",
  "httpx==0.28.1",
  "pytest-asyncio==1.4.0",
  "types-pyyaml==6.0.12.20260906",
]

[tool.uv]
package = false

[tool.uv.workspace]
# One member per CLAUDE.md §13 entry. services/edge is a reverse-proxy config, not Python.
members = ["apps/api", "packages/*", "services/*"]
exclude = ["services/edge"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", "apps/webui", "tests/e2e", "node_modules"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, S bandit (shell=True and
# friends), N naming.
select = ["E", "W", "F", "I", "B", "UP", "S", "N"]

[tool.ruff.lint.per-file-ignores]
# asserts and argv subprocess calls are the point of tests; S105-S107 flag literal passwords,
# which fixtures for the login flow need (they are fake credentials against fake stores).
"tests/**" = ["S101", "S603", "S607", "S105", "S106", "S107"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["apps/api", "packages", "services", "tests/unit", "tests/deploy", "tests/integration"]
explicit_package_bases = true
namespace_packages = true
# Every workspace member uses a flat layout (CLAUDE.md §0.1 names
# packages/slas-kernel/slas_kernel/branding.py), so each member root is a package base.
mypy_path = [
  "apps/api",
  "packages/slas-kernel", "packages/slas-schemas", "packages/slas-authz", "packages/slas-hal",
  "packages/slas-skills", "packages/slas-screen", "packages/slas-git", "packages/slas-diff",
  "packages/slas-triage", "packages/slas-rag", "packages/slas-sop", "packages/slas-eval",
  "packages/slas-cli",
  "services/agent-core-orchestrator", "services/llm-gateway", "services/model-manager",
  "services/sandbox-manager", "services/screen-worker", "services/git-broker",
  "services/validation-executor", "services/factory-executor", "services/station-runner",
  "services/local-search-api",
]

[tool.pytest.ini_options]
# tests/integration needs an ephemeral Postgres and is run by its own CI job with an explicit
# path (see .github/workflows/ci.yml); it is deliberately not in testpaths.
testpaths = ["tests/unit", "tests/deploy"]
addopts = "-q -ra"
xfail_strict = true
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
